<!DOCTYPE html>
<html xml:lang="es">
  <head>
    <title>Calculadora de Cadenas</title>
  </head>
  <body>
    <h1>Calculadora de Cadenas</h1>
    <form id="calculadora-form">
      <label for="cadena-input">Ingrese la cadena de números:</label>
      <input type="text" id="cadena-input" placeholder="Ej: 1,2,3 o //[;] 1;2" />
      <input type="submit" value="Calcular" id="calcular-button" />
    </form>
    <div id="resultado-div"></div>

    <script type="module" src="./src/presenter.js"></script>
  </body>
</html>
